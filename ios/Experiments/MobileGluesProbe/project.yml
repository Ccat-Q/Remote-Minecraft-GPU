name: MobileGluesCompatibilityProbe
options:
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGNING_ALLOWED: NO
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../../../_deps/mobileglues/MobileGlues-cpp/include"
targets:
  MobileGluesCompatibilityProbe:
    type: application
    platform: iOS
    sources:
      - App
      - path: Generated/B11Provenance.json
        buildPhase: resources
      - path: Generated/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.remotegpu.experiments.mobileglues
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: RemoteGPU B1.1
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies: &probeProviders
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - framework: ../../../_build/mobileglues/MobileGluesProbe.framework
        embed: true
        link: false
      - framework: ../../../_deps/ios-sysroot/Frameworks/EGL.framework
        embed: true
        link: false
      - framework: ../../../_deps/ios-sysroot/Frameworks/GLESv2.framework
        embed: true
        link: false
  MobileGluesShaderProbe:
    type: application
    platform: iOS
    sources:
      - App
      - Shader
      - path: Generated/B11Provenance.json
        buildPhase: resources
      - path: Generated/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.remotegpu.experiments.mobileglues.shader
        TARGETED_DEVICE_FAMILY: "1"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) RGPU_B12_SHADER_PROBE=1"
    info:
      path: Generated/B12Info.plist
      properties:
        CFBundleDisplayName: RemoteGPU B1.2a
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies: *probeProviders
  MobileGluesFeaturesProbe:
    type: application
    platform: iOS
    sources:
      - App
      - Shader
      - path: Generated/B11Provenance.json
        buildPhase: resources
      - path: Generated/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.remotegpu.experiments.mobileglues.features
        TARGETED_DEVICE_FAMILY: "1"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) RGPU_B12_SHADER_PROBE=1 RGPU_B12_FEATURE_PROBE=1"
    info:
      path: Generated/B12bInfo.plist
      properties:
        CFBundleDisplayName: RemoteGPU B1.2b
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies: *probeProviders
  MobileGluesRasterProbe:
    type: application
    platform: iOS
    sources:
      - App
      - Shader
      - path: Generated/B11Provenance.json
        buildPhase: resources
      - path: Generated/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.remotegpu.experiments.mobileglues.raster
        TARGETED_DEVICE_FAMILY: "1"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) RGPU_B12_SHADER_PROBE=1 RGPU_B12_FEATURE_PROBE=1 RGPU_B12_RASTER_PROBE=1"
    info:
      path: Generated/B12cInfo.plist
      properties:
        CFBundleDisplayName: RemoteGPU B1.2c
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies: *probeProviders
schemes:
  MobileGluesCompatibilityProbe:
    build:
      targets:
        MobileGluesCompatibilityProbe: all
  MobileGluesShaderProbe:
    build:
      targets:
        MobileGluesShaderProbe: all
  MobileGluesFeaturesProbe:
    build:
      targets:
        MobileGluesFeaturesProbe: all
  MobileGluesRasterProbe:
    build:
      targets:
        MobileGluesRasterProbe: all
