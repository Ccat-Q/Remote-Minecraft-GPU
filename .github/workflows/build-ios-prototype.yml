name: Build iOS interop prototype
on:
  push:
    branches: [feature/reverse-vtest-hardening]
    paths:
      - ios/**
      - tools/ci/ios_provenance.py
      - tools/ci/test_ios_provenance.py
      - tools/ci/prepare_utm_renderer.py
      - .github/workflows/build-ios-prototype.yml
  pull_request:
    paths:
      - ios/**
      - tools/ci/ios_provenance.py
      - tools/ci/test_ios_provenance.py
      - tools/ci/prepare_utm_renderer.py
      - .github/workflows/build-ios-prototype.yml
  workflow_dispatch:
    inputs:
      renderer_run_id:
        description: Successful Build iOS renderer sysroot run (including link gate)
        required: true
  workflow_run:
    workflows: [Build iOS renderer sysroot]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build:
    # Fork PRs are explicitly not an iOS compile acceptance result. Never use
    # pull_request_target to give untrusted code a privileged build context.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # macos-14 was rejected before job startup; use the same supported image
    # already used by this repository's Swift and isolated Geometry gates.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      # Verified successful renderer/link-gate run; retained artifact checked
      # again at runtime. Never rebuild dependencies or silently select latest.
      RENDERER_RUN_ID: ${{ inputs.renderer_run_id || github.event.workflow_run.id || '40636888480' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Deliberately no Actions cache: PR code must not save sysroots or build
      # products that a later trusted workflow could restore.
      - name: Fetch verified device renderer dependencies
        run: |
          set -euo pipefail
          [[ "$RENDERER_RUN_ID" =~ ^[0-9]+$ ]]
          run_api="repos/$GITHUB_REPOSITORY/actions/runs/$RENDERER_RUN_ID"
          test "$(gh api "$run_api" --jq .head_repository.full_name)" = "$GITHUB_REPOSITORY"
          test "$(gh api "$run_api" --jq .path)" = '.github/workflows/build-ios-renderer.yml'
          test "$(gh api "$run_api" --jq .event)" = workflow_dispatch
          test "$(gh run view "$RENDERER_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RENDERER_RUN_ID" --json workflowName --jq .workflowName)" = 'Build iOS renderer sysroot'
          test "$(gh run view "$RENDERER_RUN_ID" --json jobs --jq '[.jobs[].steps[] | select(.name == "Verify iPhoneOS ANGLE and VirGL linkage" and .conclusion == "success")] | length')" = 1
          revision=$(gh run view "$RENDERER_RUN_ID" --json headSha --jq .headSha)
          # The native diagnostic borrows an external EGLDisplay. Do not
          # package it with the earlier recipe that leaked on non-GBM iOS.
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/ci/prepare_utm_renderer.py?ref=$revision" --jq .content | \
            python3 -c 'import base64,sys; source=base64.b64decode(sys.stdin.read()).decode(); sys.exit(0 if "def fix_winsys(" in source and "--winsys" in source else "Renderer sysroot predates external-EGL cleanup fix; run updated Build iOS renderer sysroot first.")'
          if [ "$RENDERER_RUN_ID" = '40636888480' ]; then
            test "$revision" = '61abde5f505165ff7200b2600a6cbaf7ea2f426c'
          fi
          export RENDERER_ARTIFACT="ios-renderer-sysroot-$revision"
          test "$(gh api "$run_api/artifacts?per_page=100" | python3 -c 'import json,os,sys; print(sum(a["name"] == os.environ["RENDERER_ARTIFACT"] and not a["expired"] for a in json.load(sys.stdin)["artifacts"]))')" = 1
          gh run download "$RENDERER_RUN_ID" --name "$RENDERER_ARTIFACT" --dir _deps/ios-sysroot
      - name: Record app and actual renderer artifact provenance
        run: |
          python3 tools/ci/ios_provenance.py --renderer-run-id "$RENDERER_RUN_ID" \
            --sysroot _deps/ios-sysroot --output ios/App/RGPUProvenance.json
      - name: Check build provenance parser
        run: python3 -m unittest discover -s tools/ci -p 'test_ios_provenance.py'
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Build unsigned iPhone device app
        run: |
          set -o pipefail
          xcodebuild -project ios/RemoteGPUPrototype.xcodeproj -scheme RemoteGPUPrototype \
            -sdk iphoneos -configuration Release -derivedDataPath _build/ios-prototype \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-prototype-build.log
      - name: Package device app for external signing
        run: |
          test -f _build/ios-prototype/Build/Products/Release-iphoneos/RemoteGPUPrototype.app/default.metallib
          test -f _build/ios-prototype/Build/Products/Release-iphoneos/RemoteGPUPrototype.app/RGPUProvenance.json
          mkdir -p _stage/ios-prototype/Payload
          cp -R _build/ios-prototype/Build/Products/Release-iphoneos/RemoteGPUPrototype.app _stage/ios-prototype/Payload/
          cd _stage/ios-prototype
          zip -r RemoteGPUPrototype-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-interop-prototype-${{ github.sha }}
          path: _stage/ios-prototype/RemoteGPUPrototype-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-interop-prototype-diagnostics-${{ github.run_id }}
          path: |
            ios-prototype-build.log
            ios/App/RGPUProvenance.json
          if-no-files-found: warn
