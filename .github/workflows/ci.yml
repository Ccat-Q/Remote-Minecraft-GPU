name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-vtest:
    name: Native legacy vtest contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install API headers
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libvirglrenderer-dev
      - name: Build and exercise native decoder with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -Iios/Renderer ios/Renderer/RGPUVTestSession.cpp tests/native_vtest.cpp -o /tmp/native-vtest-contract
          /tmp/native-vtest-contract
      - name: Test actual double-buffer slot ownership with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -Iios/Renderer tests/display_slots.cpp -o /tmp/display-slots-contract
          /tmp/display-slots-contract
      - name: Test actual isolated B1.1 shared platform resolver with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -Iios/Experiments/MobileGluesProbe/Overlay tests/b11_provider_policy.cpp -o /tmp/b11-provider-policy
          /tmp/b11-provider-policy
      - name: Test actual isolated B1.1 context metadata API plan with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -Iios/Experiments/MobileGluesProbe/App tests/b11_context_metadata.cpp -o /tmp/b11-context-metadata
          /tmp/b11-context-metadata

  ios-build-compatibility:
    name: Pinned iOS build compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify compatibility patch guards
        run: python3 -m unittest discover -s tools/ci -p 'test_utm_renderer.py'
      - name: Verify iOS dependency provenance parser
        run: python3 -m unittest discover -s tools/ci -p 'test_ios_provenance.py'
      - name: Verify isolated MobileGlues source/provider guards (not device acceptance)
        run: python3 -m unittest discover -s tools/ci -p 'test_mobileglues_probe.py'
      - name: Verify device evidence checker (synthetic logs, NOT device acceptance)
        run: python3 -m unittest discover -s tools -p 'test_a21_device_evidence.py'
      - name: Verify configurable live hold shell policy (stub producer only)
        run: python3 -m unittest discover -s tools -p 'test_a21_case_policy.py'

  linux-proxy:
    name: Linux proxy and protocol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.sum
      - name: Verify module graph
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit tests
        run: go test ./...
      - name: Static analysis
        run: go vet ./...

  ios-protocol:
    name: iOS protocol package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: |
            ios/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Package.swift', 'ios/Package.resolved') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-
      - name: Build Swift protocol package
        run: swift build --package-path ios
      - name: Test Swift protocol package
        run: swift test --package-path ios
      - name: Type-check actual iPhone UI and Keychain interfaces (no renderer link)
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library -swift-version 5 \
            -module-name RemoteGPUPrototype -target arm64-apple-ios17.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -import-objc-header ios/App/RemoteGPU-Bridging-Header.h \
            ios/App/*.swift ios/RemoteGPU/*.swift

  mesa-patch-contract:
    name: Mesa patch contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the patch contract is documented
        run: |
          grep -q 'virgl_vtest_flush_frontbuffer' patches/mesa/README.md
          grep -q 'byte_offset' patches/mesa/README.md
          grep -q 'REMOTEGPU_VTEST_LEGACY' patches/mesa/0001-remotegpu-force-legacy-vtest.patch

  mesa-patch-applies:
    name: Mesa legacy patch applies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Mesa source
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: ~/remotegpu-mesa
          key: mesa-source-590bf21d918c86908d96d1f4590ecd25b9657171
      - name: Fetch pinned Mesa source
        run: |
          if [ ! -d "$HOME/remotegpu-mesa/.git" ]; then
            git clone --filter=blob:none https://gitlab.freedesktop.org/mesa/mesa.git "$HOME/remotegpu-mesa"
          fi
          git -C "$HOME/remotegpu-mesa" fetch --depth=1 origin 590bf21d918c86908d96d1f4590ecd25b9657171
          git -C "$HOME/remotegpu-mesa" checkout --detach 590bf21d918c86908d96d1f4590ecd25b9657171
      - name: Verify patch applicability
        run: git -C "$HOME/remotegpu-mesa" apply --check "$GITHUB_WORKSPACE/patches/mesa/0001-remotegpu-force-legacy-vtest.patch" "$GITHUB_WORKSPACE/patches/mesa/0002-remotegpu-present.patch"
      - name: Print pinned source context on every result
        if: always()
        run: |
          git -C "$HOME/remotegpu-mesa" show HEAD:src/gallium/winsys/virgl/vtest/virgl_vtest_socket.c | \
            grep -n -A45 'int virgl_vtest_connect'
      - name: Export pinned winsys source for presentation development
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vtest-source-${{ github.sha }}
          path: ~/remotegpu-mesa/src/gallium/winsys/virgl/vtest/
          if-no-files-found: error
          retention-days: 7
      - name: Generate byte-exact candidate patch on failure
        if: failure()
        run: |
          python3 "$GITHUB_WORKSPACE/tools/generate_mesa_legacy_patch.py" \
            "$HOME/remotegpu-mesa/src/gallium/winsys/virgl/vtest/virgl_vtest_socket.c"
          git -C "$HOME/remotegpu-mesa" diff -- \
            src/gallium/winsys/virgl/vtest/virgl_vtest_socket.c > /tmp/remotegpu-generated.patch
          diff -u \
            <(sed -n '/^diff --git/,$p' "$GITHUB_WORKSPACE/patches/mesa/0001-remotegpu-force-legacy-vtest.patch") \
            /tmp/remotegpu-generated.patch || true
          git -C "$HOME/remotegpu-mesa" checkout -- \
            src/gallium/winsys/virgl/vtest/virgl_vtest_socket.c
          git -C "$HOME/remotegpu-mesa" apply --check /tmp/remotegpu-generated.patch
