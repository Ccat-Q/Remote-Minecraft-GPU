name: Native vtest rendering gate
on:
  push:
    paths:
      - ios/Renderer/RGPUVTestSession.*
      - ios/Renderer/RGPUVirglAPI.hpp
      - linux/tools/native-vtest-server.cpp
      - linux/tools/remote-present-verifier.hpp
      - cmd/remotegpu-vtest-receiver/**
      - tests/gl_remote_present.c
      - tests/mesa_present_gate.py
      - tests/native_vtest_lifetime.cpp
      - tests/a2_virgl_pattern.cpp
      - ios/Renderer/RGPUVirglPattern.hpp
      - .github/workflows/native-vtest-gate.yml
  workflow_dispatch:
    inputs:
      linux_run_id:
        description: Verified Build Linux PoC bundle to reuse (no dependency rebuild)
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: native-vtest-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      # Exact retained dependency bundle used by accepted A1; never silently
      # select a different latest-main build for the A2 fixture/regressions.
      LINUX_RUN_ID: ${{ inputs.linux_run_id || '38186021966' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.sum
      - name: Download verified Mesa and renderer bundle
        run: |
          if [ -z "$LINUX_RUN_ID" ]; then
            LINUX_RUN_ID=$(gh run list --workflow build-linux-poc.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$LINUX_RUN_ID" && test "$LINUX_RUN_ID" != null
          test "$(gh run view "$LINUX_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$LINUX_RUN_ID" --json workflowName --jq .workflowName)" = 'Build Linux PoC'
          test "$(gh run view "$LINUX_RUN_ID" --json jobs --jq '[.jobs[].steps[] | select(.name == "Verify Mesa PRESENT without presentation readback" and .conclusion == "success")] | length')" = 1
          revision=$(gh run view "$LINUX_RUN_ID" --json headSha --jq .headSha)
          if ! gh run download "$LINUX_RUN_ID" --name "linux-poc-$revision" --dir _stage; then
            echo 'Verified bundle unavailable/expired: rerun Build Linux PoC, or specify a retained successful linux_run_id.' >&2
            exit 1
          fi
          # Artifact transport does not preserve executable permissions.
          chmod +x _stage/bin/* _stage/virglrenderer/bin/virgl_test_server
      - name: Install runtime and adapter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libepoxy0 libgbm1 libegl1 libegl-mesa0 libgles2 libglfw3-dev libglew-dev libgl1-mesa-dri xvfb xauth
      - name: Compile only the new native adapter
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iios/Renderer -I_stage/virglrenderer/include \
            ios/Renderer/RGPUVTestSession.cpp linux/tools/native-vtest-server.cpp \
            -L_stage/virglrenderer/lib/x86_64-linux-gnu -lvirglrenderer -o _stage/bin/native-vtest-server
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iios/Renderer -I_stage/virglrenderer/include \
            ios/Renderer/RGPUVTestSession.cpp tests/native_vtest_lifetime.cpp \
            -L_stage/virglrenderer/lib/x86_64-linux-gnu -lvirglrenderer -o _stage/bin/native-vtest-lifetime
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iios/Renderer -I_stage/virglrenderer/include \
            ios/Renderer/RGPUVTestSession.cpp tests/a2_virgl_pattern.cpp \
            -L_stage/virglrenderer/lib/x86_64-linux-gnu -lvirglrenderer -o _stage/bin/a2-virgl-pattern
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/gl_remote_present.c -lglfw -lGLEW -lGL -lm -o _stage/bin/gl-remote-present
          go build -trimpath -o _stage/bin/remotegpu-vtest-receiver ./cmd/remotegpu-vtest-receiver
      - name: Verify real renderer presentation resource lifetime
        run: |
          set -o pipefail
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/_stage/virglrenderer/lib/x86_64-linux-gnu" \
            timeout 45s _stage/bin/native-vtest-lifetime 2>&1 | tee native-vtest-lifetime.log
      - name: Run native decoder with actual GL through QUIC
        run: |
          set -o pipefail
          python3 tests/mesa_present_gate.py _stage --native 2>&1 | tee native-vtest-gate.log
      - name: Verify A2 VirGL GPU pattern and retained resource
        run: |
          set -o pipefail
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/_stage/virglrenderer/lib/x86_64-linux-gnu" \
            timeout 45s _stage/bin/a2-virgl-pattern 2>&1 | tee a2-virgl-pattern.log
      - name: Verify A1 dynamic receiver pixels and negative controls
        run: |
          set -o pipefail
          python3 tests/mesa_present_gate.py _stage --dynamic 2>&1 | tee a1-dynamic-present.log
      - name: Verify dynamic demo argument handling
        run: |
          _stage/bin/gl-remote-present --help
          for args in '--frames 0' '--frames 1.5' '--fps nan' '--fps 0' '--hold-seconds 0' '--unknown 1'; do
            set +e
            _stage/bin/gl-remote-present $args
            result=$?
            set -e
            test "$result" = 2
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-vtest-gate-${{ github.run_id }}
          path: |
            native-vtest-gate.log
            native-vtest-lifetime.log
            a1-dynamic-present.log
            a2-virgl-pattern.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: a1-tools-${{ github.sha }}
          path: |
            _stage/bin/gl-remote-present
            _stage/bin/native-vtest-server
            _stage/bin/remotegpu-vtest-receiver
          if-no-files-found: error
