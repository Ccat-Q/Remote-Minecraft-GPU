name: Build isolated iOS MobileGlues probe
on:
  workflow_dispatch:
    inputs:
      renderer_run_id:
        description: Exact verified ANGLE sysroot run (no renderer rebuild)
        required: true
        default: "40636888480"
  push:
    branches: [experiment/b11-mobileglues-probe]
    paths:
      - ios/Experiments/MobileGluesProbe/**
      - tools/ci/*mobileglues*
      - .github/workflows/build-ios-compatibility-probe.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: b11-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RENDERER_RUN_ID: ${{ inputs.renderer_run_id || '40636888480' }}
      MG_SHA: 97558a69157b033b890958b1e49258c5b51a80c6
      CCACHE_DIR: ${{ github.workspace }}/.cache/b11-ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact verified renderer artifact
        id: renderer-cache
        uses: actions/cache@v4
        with:
          path: _deps/ios-sysroot
          key: ios-device-sysroot-run-${{ env.RENDERER_RUN_ID }}
      - name: Verify and fetch accepted ANGLE sysroot (no rebuild)
        run: |
          test "$(gh run view "$RENDERER_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RENDERER_RUN_ID" --json workflowName --jq .workflowName)" = 'Build iOS renderer sysroot'
          test "$(gh run view "$RENDERER_RUN_ID" --json jobs --jq '[.jobs[].steps[] | select(.name == "Verify iPhoneOS ANGLE and VirGL linkage" and .conclusion == "success")] | length')" = 1
          revision=$(gh run view "$RENDERER_RUN_ID" --json headSha --jq .headSha)
          if [ '${{ steps.renderer-cache.outputs.cache-hit }}' != 'true' ]; then
            gh run download "$RENDERER_RUN_ID" --name "ios-renderer-sysroot-$revision" --dir _deps/ios-sysroot
          fi
          mkdir -p _build/b11-diagnostics ios/Experiments/MobileGluesProbe/Generated/Licenses
          python3 tools/ci/ios_provenance.py --renderer-run-id "$RENDERER_RUN_ID" \
            --sysroot _deps/ios-sysroot --output _build/b11-diagnostics/ANGLEProvenance.json
      - name: Checkout immutable candidate and exact shader dependencies
        uses: actions/checkout@v4
        with:
          repository: MobileGL-Dev/MobileGlues
          ref: 97558a69157b033b890958b1e49258c5b51a80c6
          path: _deps/mobileglues
          submodules: false
      - name: Fetch only required immutable submodules
        run: |
          git -C _deps/mobileglues submodule update --init --depth 1 \
            MobileGlues-cpp/3rdparty/glslang MobileGlues-cpp/3rdparty/SPIRV-Cross \
            MobileGlues-cpp/3rdparty/xxhash MobileGlues-cpp/include/ska
          git -C _deps/mobileglues submodule status > _build/b11-diagnostics/submodules.txt
      - name: Apply checked isolated Apple provider adaptation
        run: |
          python3 tools/ci/prepare_mobileglues_probe.py --source _deps/mobileglues \
            --overlay ios/Experiments/MobileGluesProbe/Overlay --manifest _build/b11-diagnostics/MobileGluesRecipe.json
          python3 -m unittest discover -s tools/ci -p test_mobileglues_probe.py
          git -C _deps/mobileglues diff -- MobileGlues-cpp > _build/b11-diagnostics/mobileglues-adaptation.patch
          cp ios/Experiments/MobileGluesProbe/Overlay/* _build/b11-diagnostics/
      - name: Install small build tools and fingerprint toolchain
        id: toolchain
        run: |
          brew install cmake ninja ccache xcodegen
          { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; cmake --version; } > _build/b11-diagnostics/toolchain.txt
          echo "fingerprint=$(shasum -a 256 _build/b11-diagnostics/toolchain.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore exact candidate framework cache
        id: candidate-cache
        uses: actions/cache@v4
        with:
          path: _build/mobileglues/MobileGluesProbe.framework
          key: b11-framework-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ env.MG_SHA }}-${{ hashFiles('tools/ci/prepare_mobileglues_probe.py', 'ios/Experiments/MobileGluesProbe/Overlay/**') }}
      - name: Restore compiler results for partial or changed candidate builds
        uses: actions/cache/restore@v4
        id: compiler-cache
        if: steps.candidate-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/b11-ccache
          key: b11-ccache-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ env.MG_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            b11-ccache-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ env.MG_SHA }}-
      - name: Build candidate iPhone ARM64 framework (ANGLE unchanged)
        if: steps.candidate-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cmake -S _deps/mobileglues/MobileGlues-cpp -B _build/mobileglues -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee _build/b11-diagnostics/cmake.log
          cmake --build _build/mobileglues --parallel 3 2>&1 | tee _build/b11-diagnostics/candidate-build.log
      - name: Verify framework architecture, dependencies and exported providers
        run: |
          framework=_build/mobileglues/MobileGluesProbe.framework/MobileGluesProbe
          test "$(lipo -archs "$framework")" = arm64
          otool -L "$framework" | tee _build/b11-diagnostics/mobileglues-linkage.txt
          ! otool -L "$framework" | grep -E 'OpenGLES.framework|OpenGL.framework|libEGL|libGLESv2|virglrenderer|epoxy'
          nm -gU "$framework" > _build/b11-diagnostics/mobileglues-exports.txt
          for name in rgpu_mg_bootstrap eglCreateContext eglMakeCurrent eglGetProcAddress glGetString glBindTexture glFramebufferTexture2D glReadPixels; do
            grep -E " _${name}$" _build/b11-diagnostics/mobileglues-exports.txt
          done
          python3 tools/ci/inspect_macho.py "$framework" > _build/b11-diagnostics/macho.txt
      - name: Preserve LGPL corresponding source and licenses
        run: |
          # Full modified candidate + exact dependency sources, not patch-only.
          tar --exclude=.git -czf _build/b11-diagnostics/MobileGlues-corresponding-source.tar.gz -C _deps/mobileglues LICENSE MobileGlues-cpp
          cp _deps/mobileglues/LICENSE ios/Experiments/MobileGluesProbe/Generated/Licenses/MobileGlues-LGPL-2.1.txt
          for component in glslang SPIRV-Cross xxhash; do
            mkdir -p "ios/Experiments/MobileGluesProbe/Generated/Licenses/$component"
            find "_deps/mobileglues/MobileGlues-cpp/3rdparty/$component" -maxdepth 2 -type f \( -iname '*license*' -o -iname '*copying*' -o -iname '*copyright*' \) -exec cp {} "ios/Experiments/MobileGluesProbe/Generated/Licenses/$component/" \;
          done
          mkdir -p ios/Experiments/MobileGluesProbe/Generated/Licenses/ska
          find _deps/mobileglues/MobileGlues-cpp/include/ska -maxdepth 1 -type f -iname '*license*' -exec cp {} ios/Experiments/MobileGluesProbe/Generated/Licenses/ska/ \;
          gh api 'repos/utmapp/WebKit/contents/Source/ThirdParty/ANGLE/LICENSE?ref=ed78ab6e1a37f4f11583a0bd038f22ec91f3ff10' \
            -H 'Accept: application/vnd.github.raw+json' > ios/Experiments/MobileGluesProbe/Generated/Licenses/ANGLE-LICENSE.txt
      - name: Record exact bundled framework and source provenance
        run: |
          python3 tools/ci/mobileglues_provenance.py --angle _build/b11-diagnostics/ANGLEProvenance.json \
            --recipe _build/b11-diagnostics/MobileGluesRecipe.json --candidate _build/mobileglues/MobileGluesProbe.framework/MobileGluesProbe \
            --output ios/Experiments/MobileGluesProbe/Generated/B11Provenance.json
          cp ios/Experiments/MobileGluesProbe/Generated/B11Provenance.json _build/b11-diagnostics/
      - name: Build independent unsigned device app
        run: |
          set -o pipefail
          xcodegen generate --spec ios/Experiments/MobileGluesProbe/project.yml --project ios/Experiments/MobileGluesProbe
          xcodebuild -project ios/Experiments/MobileGluesProbe/MobileGluesCompatibilityProbe.xcodeproj \
            -scheme MobileGluesCompatibilityProbe -sdk iphoneos -configuration Release \
            -derivedDataPath _build/b11-app CODE_SIGNING_ALLOWED=NO build 2>&1 | tee _build/b11-diagnostics/app-build.log
      - name: Package self-signable IPA and verify isolation
        run: |
          app=_build/b11-app/Build/Products/Release-iphoneos/MobileGluesCompatibilityProbe.app
          test -f "$app/B11Provenance.json"
          test -f "$app/Frameworks/MobileGluesProbe.framework/MobileGluesProbe"
          test ! -e "$app/Frameworks/virglrenderer.1.framework"
          test ! -e "$app/Frameworks/epoxy.0.framework"
          otool -L "$app/MobileGluesCompatibilityProbe" | tee _build/b11-diagnostics/app-linkage.txt
          ! otool -L "$app/MobileGluesCompatibilityProbe" | grep -E 'OpenGLES.framework|OpenGL.framework|virglrenderer|epoxy|EGL.framework|GLESv2.framework|MobileGluesProbe.framework'
          mkdir -p _stage/b11/Payload
          cp -R "$app" _stage/b11/Payload/
          cd _stage/b11
          zip -r MobileGluesCompatibilityProbe-unsigned.ipa Payload
          shasum -a 256 MobileGluesCompatibilityProbe-unsigned.ipa > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: b11-mobileglues-probe-${{ github.sha }}
          path: |
            _stage/b11/MobileGluesCompatibilityProbe-unsigned.ipa
            _stage/b11/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
      - name: Preserve partial compiler cache
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/b11-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Compiler cache diagnostics
        if: always()
        run: |
          if command -v ccache; then ccache --show-stats; else echo 'Compiler tools not reached'; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b11-diagnostics-and-corresponding-source-${{ github.run_id }}
          path: _build/b11-diagnostics/
          retention-days: 90
          if-no-files-found: warn
