name: Build iOS renderer sysroot

on:
  workflow_dispatch:
    inputs:
      utm_revision:
        description: Pinned UTM reference revision
        required: false
        default: 9d00a54833184628c696bcbfafbf344cea566e59

permissions:
  contents: read

concurrency:
  group: build-ios-renderer-${{ inputs.utm_revision }}
  cancel-in-progress: false

jobs:
  build:
    name: UTM ANGLE/virglrenderer iOS arm64 sysroot
    runs-on: macos-14
    timeout-minutes: 180
    env:
      UTM_REVISION: ${{ inputs.utm_revision }}
      REMOTEGPU_UTM_COMPAT: ${{ github.workspace }}/tools/ci/prepare_utm_renderer.py
      CCACHE_DIR: ${{ github.workspace }}/.cache/ios-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Identify Apple toolchain
        id: toolchain
        run: |
          fingerprint=$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; xcrun clang --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore iOS renderer sysroot
        id: sysroot
        uses: actions/cache@v4
        with:
          path: _deps/UTM/sysroot-iOS-arm64
          key: ios-renderer-sysroot-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.utm_revision }}-${{ hashFiles('.github/workflows/build-ios-renderer.yml', 'tools/ci/prepare_utm_renderer.py') }}
      - name: Restore compiler cache
        id: compiler-cache
        if: steps.sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/ios-ccache
          key: ios-ccache-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.utm_revision }}-${{ hashFiles('tools/ci/prepare_utm_renderer.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-ccache-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.utm_revision }}-${{ hashFiles('tools/ci/prepare_utm_renderer.py') }}-
            ios-ccache-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ inputs.utm_revision }}-
      - name: Fetch pinned UTM reference source
        run: |
          mkdir -p _deps
          git clone --recursive https://github.com/utmapp/UTM.git _deps/UTM
          git -C _deps/UTM checkout --detach "$UTM_REVISION"
          git -C _deps/UTM submodule update --init --recursive
      - name: Apply checked Apple Clang compatibility hook
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          python3 "$REMOTEGPU_UTM_COMPAT" --script _deps/UTM/scripts/build_dependencies.sh
          bash -n _deps/UTM/scripts/build_dependencies.sh
      - name: Install UTM dependency-build prerequisites
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          brew install ccache bison pkg-config gettext glib libgpg-error nasm meson llvm spirv-llvm-translator libxcb libxrandr
          python3 -m venv .tools/utm-python
          .tools/utm-python/bin/pip install setuptools six pyparsing pyyaml distlib mako
          echo "$GITHUB_WORKSPACE/.tools/utm-python/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix glib)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libgpg-error)/bin" >> "$GITHUB_PATH"
      - name: Restore downloaded source archives
        id: archive-cache
        if: steps.sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: _deps/UTM/build-iOS-arm64/*.tar.*
          key: ios-source-archives-v1-${{ inputs.utm_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-source-archives-v1-${{ inputs.utm_revision }}-
      - name: Build iOS arm64 renderer dependencies
        if: steps.sysroot.outputs.cache-hit != 'true'
        working-directory: _deps/UTM
        shell: bash
        run: |
          set -o pipefail
          ./scripts/build_dependencies.sh -p ios -a arm64 2>&1 | tee "$GITHUB_WORKSPACE/ios-renderer-build.log"
      - name: Verify ANGLE and virglrenderer sysroot outputs
        run: |
          test -d _deps/UTM/sysroot-iOS-arm64
          find _deps/UTM/sysroot-iOS-arm64 -iname '*virglrenderer*' -print -quit | grep .
          find _deps/UTM/sysroot-iOS-arm64 -iname 'EGL.framework' -print -quit | grep .
          find _deps/UTM/sysroot-iOS-arm64 -iname 'GLESv2.framework' -print -quit | grep .
      - name: Verify iPhoneOS ANGLE and VirGL linkage
        run: |
          sysroot="$GITHUB_WORKSPACE/_deps/UTM/sysroot-iOS-arm64"
          mkdir -p _stage/ios
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 -dynamiclib tests/ios_renderer_link.c \
            -I"$sysroot/include" -I"$sysroot/include/virgl" -L"$sysroot/lib" \
            -lvirglrenderer -lEGL -lGLESv2 -o _stage/ios/renderer-link-probe.dylib
          xcrun vtool -show-build _stage/ios/renderer-link-probe.dylib
          otool -L _stage/ios/renderer-link-probe.dylib
      - name: Publish iOS renderer sysroot
        uses: actions/upload-artifact@v4
        with:
          name: ios-renderer-sysroot-${{ github.sha }}
          path: _deps/UTM/sysroot-iOS-arm64
          if-no-files-found: error
          retention-days: 14
      - name: Publish build diagnostics on every result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-renderer-diagnostics-${{ github.run_id }}
          path: |
            ios-renderer-build.log
            _stage/ios/renderer-link-probe.dylib
            _deps/UTM/build-iOS-arm64/**/meson-logs/meson-log.txt
            _deps/UTM/build-iOS-arm64/**/config.log
          if-no-files-found: warn
          retention-days: 14
      - name: Report compiler cache statistics
        if: always() && steps.sysroot.outputs.cache-hit != 'true'
        run: command -v ccache && ccache --show-stats
      - name: Preserve compiler cache after partial builds
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/ios-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Preserve downloaded archives after partial builds
        if: always() && steps.archive-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: _deps/UTM/build-iOS-arm64/*.tar.*
          key: ${{ steps.archive-cache.outputs.cache-primary-key }}
